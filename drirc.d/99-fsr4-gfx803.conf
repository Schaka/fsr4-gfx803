<?xml version="1.0" standalone="yes"?>
<!-- Copy to ~/.drirc. Turns on the RADV feature shaderFloat16 on GFX8 (Polaris),
     which FSR4's shaders need. It matches every executable, because a game
     launched through Proton does not run under a name you can predict. -->
<!DOCTYPE driconf [
   <!ELEMENT driconf      (device+)>
   <!ELEMENT device       (application | engine)+>
   <!ATTLIST device       driver CDATA #IMPLIED
                          device CDATA #IMPLIED>
   <!ELEMENT application  (option+)>
   <!ATTLIST application  name CDATA #REQUIRED
                          executable CDATA #IMPLIED
                          executable_regexp CDATA #IMPLIED
                          sha1 CDATA #IMPLIED
                          application_name_match CDATA #IMPLIED
                          application_versions CDATA #IMPLIED>
   <!ELEMENT engine  (option+)>
   <!ATTLIST engine  name CDATA #REQUIRED
                     engine_name_match CDATA #IMPLIED
                     engine_versions CDATA #IMPLIED>
   <!ELEMENT option       EMPTY>
   <!ATTLIST option       name CDATA #REQUIRED
                          value CDATA #REQUIRED>
]>
<driconf>
    <device>
        <application name="FSR4 on GFX8 - fp16 everywhere" executable_regexp=".*">
            <option name="radv_enable_float16_gfx8" value="true" />
        </application>
    </device>
</driconf>
